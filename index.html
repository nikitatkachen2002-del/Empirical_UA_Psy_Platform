<script>
    const testsDb = [
        {
            id: 'phq9',
            title: 'Опитувальник здоров\'я пацієнта (PHQ-9)',
            category: 'Депресія',
            description: 'Найпоширеніший у світі короткий тест (9 питань) для скринінгу депресії та оцінки її тяжкості за останні 2 тижні.',
            options: [
                {text: 'Зовсім ні', score: 0},
                {text: 'Кілька днів', score: 1},
                {text: 'Більше половини днів', score: 2},
                {text: 'Майже щодня', score: 3}
            ],
            questions: [
                "Мало інтересу чи задоволення від того, що ви робите?",
                "Відчуття пригніченості, депресії чи безнадії?",
                "Проблеми із засинанням чи сном, або занадто тривалий сон?",
                "Відчуття втоми чи нестачі енергії?",
                "Поганий апетит чи переїдання?",
                "Погане ставлення до себе, відчуття, що ви невдаха, або підвели себе чи сім'ю?",
                "Проблеми з концентрацією уваги (наприклад, під час читання чи перегляду телевізора)?",
                "Рухаєтесь або говорите настільки повільно, що це помічають інші? Або навпаки — сильна метушливість?",
                "Думки про те, що вам було б краще померти, або про заподіяння собі шкоди?"
            ],
            interpret: (score) => {
                if (score <= 4) return "Відсутність депресії (0-4 бали).";
                if (score <= 9) return "Легка депресія (5-9 балів). Рекомендується спостереження.";
                if (score <= 14) return "Помірна депресія (10-14 балів). Рекомендується консультація лікаря.";
                if (score <= 19) return "Виражена депресія (15-19 балів). Необхідна консультація спеціаліста.";
                return "Важка депресія (20-27 балів). Терміново зверніться до спеціаліста.";
            },
            getClinicalPicture: (score, demo) => {
                let level = score <= 4 ? "мінімальний" : score <= 9 ? "легкий" : score <= 14 ? "помірний" : score <= 19 ? "виражений" : "тяжкий";
                let statusStr = demo.status === 'student' ? `студент(ка) ${demo.course} курсу` : "викладач/співробітник";
                return `Клінічний профіль обстеженого (${statusStr}, вік: ${demo.age} років, стать: ${demo.gender}):\n- Емоційний стан: За результатами скринінгу PHQ-9 виявлено ${level} рівень вираженості депресивної симптоматики (загальний бал — ${score}).\n- Афективна та соматовегетативна сфера: Відзначаються зміни в енергетичному балансі, якості сну та рівні повсякденної мотивації.\n- Рекомендації: Проведення клінічного інтерв'ю та динамічне спостереження за станом психологічного благополуччя.`;
            }
        }
    ];

    const app = {
        participantId: '',
        demographics: {},
        currentTest: null,
        lastResultData: null,

        init() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }

            const savedId = sessionStorage.getItem('empirical_id');
            if (savedId) {
                this.participantId = savedId;
                this.demographics = JSON.parse(sessionStorage.getItem('empirical_demo'));
                this.showDashboard();
            } else {
                this.switchView('view-consent');
            }
        },

        // НОВАЯ ФУНКЦИЯ: Переключение экранов
        switchView(viewId) {
            // Список всех возможных экранов
            const views = ['view-consent', 'view-demographics', 'view-dashboard', 'view-test', 'view-result'];
            // Прячем все экраны
            views.forEach(view => {
                document.getElementById(view).classList.add('hidden');
            });
            // Показываем только тот, который нужен
            document.getElementById(viewId).classList.remove('hidden');
        },

        generateUUID() {
            return 'subj-' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
        },

        toggleConsent() {
            const isChecked = document.getElementById('consent-checkbox').checked;
            document.getElementById('btn-consent-next').disabled = !isChecked;
        },

        toggleCourseField() {
            const status = document.getElementById('demo-status').value;
            document.getElementById('group-course').style.display = status === 'student' ? 'block' : 'none';
        },

        saveDemographics() {
            const gender = document.getElementById('demo-gender').value;
            const age = document.getElementById('demo-age').value;
            const status = document.getElementById('demo-status').value;
            const course = status === 'student' ? document.getElementById('demo-course').value : null;

            if (!gender || !age || !status) {
                alert('Будь ласка, заповніть усі обов\'язкові поля анкети.');
                return;
            }

            this.participantId = this.generateUUID();
            this.demographics = { gender, age: parseInt(age), status, course };
            
            sessionStorage.setItem('empirical_id', this.participantId);
            sessionStorage.setItem('empirical_demo', JSON.stringify(this.demographics));
            
            this.showDashboard();
        },

        resetSession() {
            sessionStorage.clear();
            this.participantId = '';
            this.demographics = {};
            document.getElementById('consent-checkbox').checked = false;
            this.toggleConsent();
            this.switchView('view-consent');
        },

        showDashboard() {
            document.getElementById('display-id').textContent = this.participantId;
            const statusText = this.demographics.status === 'student' ? `Студент (${this.demographics.course} курс)` : 'Викладач';
            document.getElementById('display-status').textContent = `${statusText} | Вік: ${this.demographics.age}`;
            
            const grid = document.getElementById('test-grid');
            grid.innerHTML = '';
            
            testsDb.forEach(test => {
                const card = document.createElement('div');
                card.className = 'test-card';
                card.onclick = () => this.startTest(test.id);
                card.innerHTML = `<h3 style="margin-bottom: 0.5rem; color: var(--primary);">${test.title}</h3><p style="font-size:0.9rem; flex-grow: 1;">${test.description}</p><div style="font-weight: 500;">Розпочати →</div>`;
                grid.appendChild(card);
            });

            this.switchView('view-dashboard');
        },

        startTest(testId) {
            this.currentTest = testsDb.find(t => t.id === testId);
            document.getElementById('test-title').textContent = this.currentTest.title;
            document.getElementById('test-description').textContent = this.currentTest.description;
            
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            this.currentTest.questions.forEach((q, index) => {
                const qBlock = document.createElement('div');
                qBlock.className = 'question';
                
                if (this.currentTest.type === 'custom_options') {
                    let optsHtml = q.map((opt) => `
                        <label class="option-label"><input type="radio" name="q${index}" value="${opt.score}" onchange="app.checkProgress()"><span>${opt.text}</span></label>
                    `).join('');
                    qBlock.innerHTML = `<div class="question-title">Пункт ${index + 1} з ${this.currentTest.questions.length}</div><div class="options-group">${optsHtml}</div>`;
                } else {
                    let optsHtml = this.currentTest.options.map((opt) => `
                        <label class="option-label"><input type="radio" name="q${index}" value="${opt.score}" onchange="app.checkProgress()"><span>${opt.text}</span></label>
                    `).join('');
                    qBlock.innerHTML = `<div class="question-title">${index + 1}. ${q}</div><div class="options-group">${optsHtml}</div>`;
                }
                container.appendChild(qBlock);
            });

            const submitBtn = document.getElementById('btn-submit-test');
            submitBtn.disabled = true;
            submitBtn.textContent
